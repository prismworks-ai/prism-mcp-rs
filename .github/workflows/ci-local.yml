name: CI-Local

# Local-only CI workflow for Act
# Automatically exits if running on GitHub Actions
# Steps run sequentially for local testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_FLAGS: --all-features

jobs:
  # Check environment and exit if on GitHub
  check-environment:
    name: Environment Check
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.check.outputs.is_act }}
    steps:
      - name: Check environment
        id: check
        run: |
          if [[ "${{ env.ACT }}" == "true" ]]; then
            echo "🚀 Running in Act environment - proceeding with local CI"
            echo "is_act=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  This workflow is for local Act testing only."
            echo "✅ Skipping execution on GitHub Actions."
            echo "📝 Use ci.yml for GitHub Actions CI."
            echo "is_act=false" >> $GITHUB_OUTPUT
          fi

  # Single job that runs all CI steps sequentially
  # This ensures proper order and makes it easier to debug locally
  local-ci-sequential:
    name: Local CI Pipeline
    runs-on: ubuntu-latest
    needs: check-environment
    if: needs.check-environment.outputs.is_act == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: "[1/18] Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      
      # Step 1: Format Check
      - name: "[2/18] Check Code Formatting"
        run: |
          echo "🎨 Checking code formatting..."
          cargo fmt -- --check
          echo "✅ Formatting check passed"
      
      # Step 2: Clippy Linting
      - name: "[3/18] Run Clippy Linting"
        run: |
          echo "📋 Running clippy linter..."
          cargo clippy --all-features -- -D warnings
          echo "✅ Clippy check passed"
      
      # Step 3: Package Check
      - name: "[4/18] Verify Package Metadata"
        run: |
          echo "📦 Checking package metadata..."
          cargo package --list --allow-dirty
          echo "✅ Package check passed"
      
      # Step 4: Build Check
      - name: "[5/18] Build with All Features"
        run: |
          echo "🔨 Building with all features..."
          cargo build --verbose --all-features
          echo "✅ Build successful"
      
      # Step 5: Build with Default Features
      - name: "[6/18] Build with Default Features"
        run: |
          echo "🔨 Building with default features..."
          cargo build --verbose
          echo "✅ Default build successful"
      
      # Step 6: Build with No Features
      - name: "[7/18] Build with No Features"
        run: |
          echo "🔨 Building with no features..."
          cargo build --verbose --no-default-features
          echo "✅ Minimal build successful"
      
      # Step 7: Run Unit Tests
      - name: "[8/18] Run Unit Tests"
        run: |
          echo "🧪 Running unit tests..."
          cargo test --lib --verbose --all-features
          echo "✅ Unit tests passed"
      
      # Step 8: Run Integration Tests
      - name: "[9/18] Run Integration Tests"
        run: |
          echo "🧪 Running integration tests..."
          cargo test --test '*' --verbose --all-features
          echo "✅ Integration tests passed"
      
      # Step 9: Run Doc Tests
      - name: "[10/18] Run Documentation Tests"
        run: |
          echo "📚 Running documentation tests..."
          cargo test --doc --verbose --all-features
          echo "✅ Doc tests passed (51 tests)"
      
      # Step 10: Test with Minimal Features
      - name: "[11/18] Test with Minimal Features"
        run: |
          echo "🧪 Testing with no default features..."
          cargo test --verbose --no-default-features --lib
          echo "✅ Minimal feature tests passed"
      
      # Step 11: Build Documentation
      - name: "[12/18] Build Documentation"
        run: |
          echo "📖 Building documentation..."
          cargo doc --no-deps --all-features
          echo "✅ Documentation built successfully"
        env:
          RUSTDOCFLAGS: "-D warnings"
      
      # Step 13: Validate and Extract Documentation Examples
      - name: "[13/18] Extract and Validate Documentation Examples"
        run: |
          echo "🔍 Extracting and validating documentation examples..."
          cargo test validate_and_generate_examples -- --nocapture || echo "⚠️  Some examples need fixing"
          echo "✅ Example extraction complete"
      
      # Step 14: Build Integrated Examples
      - name: "[14/18] Build Integrated Examples"
        run: |
          echo "💡 Building integrated examples..."
          for example in examples/*.rs; do
            if [ -f "$example" ]; then
              name=$(basename "$example" .rs)
              echo "  Building example: $name"
              cargo build --example "$name" --all-features
            fi
          done
          echo "✅ Examples built successfully"
      
      # Step 15: Test Examples
      - name: "[15/18] Test Examples"
        run: |
          echo "🧪 Testing examples..."
          cargo test --examples --all-features || echo "⚠️  Some example tests failed"
          echo "✅ Example tests complete"
      
      # Step 16: Test Documentation Examples
      - name: "[16/18] Test Documentation Examples"
        run: |
          echo "📖 Testing documentation examples..."
          cargo test --doc --all-features || echo "⚠️  Some doc tests failed"
          echo "✅ Documentation examples tested"
      
      # Step 17: Security Audit
      - name: "[17/18] Security Audit"
        run: |
          echo "🔒 Running security audit..."
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo audit || echo "⚠️  Security audit tool not installed"
          else
            echo "📦 Installing cargo-audit..."
            cargo install cargo-audit --locked
            cargo audit
          fi
          echo "✅ Security audit complete"
        continue-on-error: true
      
      # Step 18: Coverage Report (Optional)
      - name: "[18/18] Generate Coverage Report"
        run: |
          echo "📊 Generating coverage report..."
          if command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
            echo "✅ Coverage report generated"
          else
            echo "⚠️  Coverage tool not installed. Install with: cargo install cargo-llvm-cov"
          fi
        continue-on-error: true
      
      # Final Summary
      - name: "📊 CI Pipeline Summary"
        if: always()
        run: |
          echo "=====================================" 
          echo "🎉 Local CI Pipeline Complete!"
          echo "====================================="
          echo ""
          echo "✅ Completed Steps:"
          echo "  1. Code Formatting Check"
          echo "  2. Clippy Linting"
          echo "  3. Package Metadata Verification"
          echo "  4. Build with All Features"
          echo "  5. Build with Default Features"
          echo "  6. Build with No Features"
          echo "  7. Unit Tests"
          echo "  8. Integration Tests"
          echo "  9. Documentation Tests (51 tests)"
          echo "  10. Minimal Feature Tests"
          echo "  11. Documentation Build"
          echo "  12. Build Documentation"
          echo "  13. Extract & Validate Doc Examples"
          echo "  14. Build All Examples"
          echo "  15. Test Examples"
          echo "  16. Build Generated Examples"
          echo "  17. Security Audit"
          echo "  18. Coverage Report"
          echo ""
          echo "📝 Note: This is a sequential run optimized for local testing."
          echo "📝 The actual CI on GitHub runs many of these in parallel."
          echo ""
          echo "💡 Example Validation Workflow:"
          echo "  1. Documentation examples are extracted from source files"
          echo "  2. Examples are validated and generated to examples/generated/"
          echo "  3. If examples fail, fix them in the source documentation"
          echo "  4. Re-run validation to regenerate corrected examples"
          echo ""
          echo "💡 Tips for local development:"
          echo "  - Run 'make quick' for formatting and basic tests"
          echo "  - Run 'make check' for standard CI checks"
          echo "  - Run 'make test' for all tests"
          echo "  - Run 'cargo test validate_and_generate_examples' to fix examples"
          echo "  - Run 'make commit-ready' for full validation"

  # Alternative: Quick validation job for faster local testing
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest
    needs: check-environment
    if: needs.check-environment.outputs.is_act == 'true' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: "Quick Format and Lint Check"
        run: |
          echo "🚀 Running quick validation..."
          echo "1️⃣ Checking formatting..."
          cargo fmt -- --check
          echo "2️⃣ Running clippy..."
          cargo clippy -- -D warnings
          echo "3️⃣ Running quick tests..."
          cargo test --lib
          echo "✅ Quick validation complete!"

# Usage with Act:
# 
# Full sequential CI:
#   act push --workflows .github/workflows/ci-local.yml
# 
# Quick check only (via workflow_dispatch):
#   act workflow_dispatch --workflows .github/workflows/ci-local.yml
#
# With specific Rust version:
#   act push --workflows .github/workflows/ci-local.yml --env RUST_VERSION=1.85
#
# With verbose output:
#   act push --workflows .github/workflows/ci-local.yml -v
#
# Dry run (see what would run):
#   act push --workflows .github/workflows/ci-local.yml -n