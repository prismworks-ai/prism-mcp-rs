name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel in-progress runs when a new push happens
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Enable all features for CI
  CARGO_BUILD_FLAGS: --all-features
  # Add timeout and retry configurations
  CARGO_NET_RETRY: 3
  CARGO_NET_TIMEOUT: 60

jobs:
  # Run tests on multiple OS and Rust versions with improved robustness
  test:
    name: Test Suite (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # Prevent hanging jobs
    strategy:
      fail-fast: false  # Continue other jobs if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
        exclude:
          # Exclude problematic combinations
          - os: windows-latest
            rust: beta
          - os: windows-latest
            rust: nightly
          # Reduce matrix for faster CI on non-critical combinations
          - os: macos-latest
            rust: beta
        include:
          # Add specific timeout for slower combinations
          - os: windows-latest
            rust: stable
            timeout: 60
          - os: macos-latest
            rust: stable
            timeout: 50
          - os: ubuntu-latest
            rust: stable
            timeout: 40
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch minimal history for faster checkout
          fetch-depth: 1
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      # Improved caching strategy with better keys and error handling
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Use more specific cache keys to avoid conflicts
          key: ${{ matrix.os }}-${{ matrix.rust }}-${{ hashFiles('Cargo.lock') }}
          # Include additional paths that might be needed
          cache-directories: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Enable cache restoration even if exact match not found
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Prevent cache corruption issues
          cache-all-crates: true
      
      # Add disk space cleanup for runners with limited space
      - name: Free disk space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af
          df -h
      
      - name: Configure cargo for reliability
        run: |
          # Configure cargo for better reliability
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [net]
          retry = 3
          timeout = 60
          
          [build]
          jobs = 2
          
          [term]
          color = "always"
          EOF
      
      - name: Update and check toolchain
        run: |
          rustc --version
          cargo --version
          echo "Rust toolchain successfully installed"
      
      # Build with timeout and retry logic
      - name: Build project
        timeout-minutes: 20
        run: |
          echo "🔨 Building project..."
          cargo build --verbose ${{ env.CARGO_BUILD_FLAGS }}
        env:
          RUST_LOG: warn
      
      # Run tests with proper timeout
      - name: Run unit tests
        timeout-minutes: 15
        run: |
          echo "🧪 Running unit tests..."
          cargo test --verbose ${{ env.CARGO_BUILD_FLAGS }} --lib
        env:
          RUST_LOG: warn
      
      - name: Run integration tests
        timeout-minutes: 10
        run: |
          echo "🔗 Running integration tests..."
          cargo test --verbose ${{ env.CARGO_BUILD_FLAGS }} --tests
        env:
          RUST_LOG: warn
      
      - name: Run doc tests
        timeout-minutes: 10
        run: |
          echo "📖 Running documentation tests..."
          cargo test --doc --verbose ${{ env.CARGO_BUILD_FLAGS }}
        env:
          RUST_LOG: warn
      
      # Add step to verify the build artifacts
      - name: Verify build artifacts
        run: |
          echo "✅ Verifying build artifacts..."
          ls -la target/
          if [ -d "target/${{ runner.os == 'Windows' && 'debug' || 'debug' }}" ]; then
            echo "Debug build artifacts found"
          else
            echo "Warning: Debug build artifacts not found"
          fi
  
  # Test with minimal features (more robust)
  minimal:
    name: Minimal Features Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: minimal-features-${{ hashFiles('Cargo.lock') }}
      
      - name: Configure cargo
        run: |
          mkdir -p ~/.cargo
          echo '[net]' >> ~/.cargo/config.toml
          echo 'retry = 3' >> ~/.cargo/config.toml
          echo 'timeout = 60' >> ~/.cargo/config.toml
      
      - name: Build with no features
        timeout-minutes: 10
        run: |
          echo "🔨 Building with no default features..."
          cargo build --verbose --no-default-features
      
      - name: Test with no features
        timeout-minutes: 10
        run: |
          echo "🧪 Testing with no default features..."
          cargo test --verbose --no-default-features
  
  # Code coverage with better error handling
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ hashFiles('Cargo.lock') }}
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      
      - name: Install additional tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc jq
      
      - name: Generate code coverage
        timeout-minutes: 15
        run: |
          echo "📊 Generating code coverage..."
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      
      - name: Generate coverage report
        run: |
          if [ -f "scripts/ci/generate-coverage-report.sh" ]; then
            chmod +x scripts/ci/generate-coverage-report.sh
            ./scripts/ci/generate-coverage-report.sh || true
          fi
          if [ -f "scripts/ci/simple-coverage.sh" ]; then
            chmod +x scripts/ci/simple-coverage.sh
            ./scripts/ci/simple-coverage.sh || true
          fi
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            reports/coverage-report.md
            lcov.info
          retention-days: 7
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
  
  # Code formatting check
  fmt:
    name: Rustfmt Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: |
          echo "🎨 Checking code formatting..."
          cargo fmt -- --check
  
  # Lint with clippy
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ hashFiles('Cargo.lock') }}
      
      - name: Run clippy
        timeout-minutes: 10
        run: |
          echo "🔍 Running Clippy lints..."
          cargo clippy ${{ env.CARGO_BUILD_FLAGS }} -- -D warnings
  
  # Build documentation
  doc:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: docs-${{ hashFiles('Cargo.lock') }}
      
      - name: Build documentation
        timeout-minutes: 10
        run: |
          echo "📚 Building documentation..."
          cargo doc --no-deps ${{ env.CARGO_BUILD_FLAGS }}
        env:
          RUSTDOCFLAGS: -D warnings
      
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: documentation
          path: target/doc/
          retention-days: 7
  
  # Security audit with better error handling
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      
      - name: Security audit
        run: |
          echo "🔒 Running security audit..."
          cargo audit || (echo "Security audit found issues" && exit 1)
  
  # Package verification
  check:
    name: Package Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: package-check-${{ hashFiles('Cargo.lock') }}
      
      - name: Check package
        run: |
          echo "📦 Checking package contents..."
          cargo package --list
      
      - name: Verify build
        timeout-minutes: 10
        run: |
          echo "✅ Verifying package build..."
          cargo check ${{ env.CARGO_BUILD_FLAGS }}
  
  # Examples testing with better organization
  examples:
    name: Examples Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: examples-${{ hashFiles('Cargo.lock') }}
      
      - name: Build examples
        timeout-minutes: 10
        run: |
          echo "🔨 Building examples..."
          if [ -d "examples" ]; then
            cargo build --examples ${{ env.CARGO_BUILD_FLAGS }}
          else
            echo "No examples directory found, skipping..."
          fi
      
      - name: Test examples
        timeout-minutes: 10
        run: |
          echo "🧪 Testing examples..."
          if [ -d "examples" ]; then
            cargo test --examples ${{ env.CARGO_BUILD_FLAGS }}
          else
            echo "No examples to test, skipping..."
          fi
  
  # Benchmarks with better error handling
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only run benchmarks on main branch to save CI time
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks-${{ hashFiles('Cargo.lock') }}
      
      - name: Install additional tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc jq
      
      - name: Build benchmarks
        timeout-minutes: 10
        run: |
          echo "🏗️ Building benchmarks..."
          if [ -d "benches" ]; then
            cargo bench --no-run ${{ env.CARGO_BUILD_FLAGS }}
          else
            echo "No benches directory found, skipping..."
          fi
      
      - name: Run benchmarks
        timeout-minutes: 15
        run: |
          echo "🏃 Running benchmarks..."
          if [ -f "scripts/ci/run-benchmarks.sh" ]; then
            chmod +x scripts/ci/run-benchmarks.sh
            ./scripts/ci/run-benchmarks.sh || echo "Benchmark script failed but continuing..."
          else
            echo "No benchmark script found, running basic benchmarks..."
            if [ -d "benches" ]; then
              cargo bench ${{ env.CARGO_BUILD_FLAGS }} || echo "Some benchmarks failed"
            fi
          fi
      
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: |
            reports/benchmark-report.md
            target/criterion/
          retention-days: 7

  # Summary job that depends on all others
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [test, minimal, fmt, clippy, doc, security, check, examples]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Checking status of all jobs..."
          
          # Required jobs that must pass
          required_jobs=("test" "minimal" "fmt" "clippy" "security" "check")
          
          for job in "${required_jobs[@]}"; do
            case "$job" in
              "test")
                if [ "${{ needs.test.result }}" != "success" ]; then
                  echo "❌ Required job '$job' failed or was cancelled"
                  exit 1
                fi
                ;;
              "minimal")
                if [ "${{ needs.minimal.result }}" != "success" ]; then
                  echo "❌ Required job '$job' failed or was cancelled"
                  exit 1
                fi
                ;;
              "fmt")
                if [ "${{ needs.fmt.result }}" != "success" ]; then
                  echo "❌ Required job '$job' failed or was cancelled"
                  exit 1
                fi
                ;;
              "clippy")
                if [ "${{ needs.clippy.result }}" != "success" ]; then
                  echo "❌ Required job '$job' failed or was cancelled"
                  exit 1
                fi
                ;;
              "security")
                if [ "${{ needs.security.result }}" != "success" ]; then
                  echo "❌ Required job '$job' failed or was cancelled"
                  exit 1
                fi
                ;;
              "check")
                if [ "${{ needs.check.result }}" != "success" ]; then
                  echo "❌ Required job '$job' failed or was cancelled"
                  exit 1
                fi
                ;;
            esac
            echo "✅ Required job '$job' passed"
          done
          
          # Optional jobs (warn but don't fail)
          if [ "${{ needs.doc.result }}" != "success" ]; then
            echo "⚠️ Optional job 'doc' failed, but not blocking CI"
          fi
          
          if [ "${{ needs.examples.result }}" != "success" ]; then
            echo "⚠️ Optional job 'examples' failed, but not blocking CI"
          fi
          
          echo "🎉 All required CI checks passed!"
