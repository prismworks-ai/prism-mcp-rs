name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build documentation site
        run: |
          cargo doc --all-features --no-deps
          mkdir -p _site
          cp -r target/doc/* _site/
          echo '<meta http-equiv="refresh" content="0; url=prism_mcp_rs/">' > _site/index.html

          # Preserve project guides as source documents without creating a
          # second hand-maintained HTML landing page.
          mkdir -p _site/project-guides
          cp -r docs/*.md docs/guides _site/project-guides/

          if [ -d docs/benchmarks ]; then
            cp -r docs/benchmarks _site/benchmarks
          fi
          
          # Create benchmarks directory if it doesn't exist
          mkdir -p _site/benchmarks
          
          # Add a placeholder for benchmarks if no data exists
          if [ ! -f "_site/benchmarks/index.html" ]; then
            cat > _site/benchmarks/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Prism MCP Benchmarks</title>
              <meta charset="utf-8">
              <style>
                  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
                  .placeholder { background: #f8f9fa; padding: 40px; border-radius: 8px; text-align: center; }
              </style>
          </head>
          <body>
              <h1>Prism MCP Performance Benchmarks</h1>
              <div class="placeholder">
                  <h2>📊 Benchmarks Coming Soon</h2>
                  <p>Performance benchmarks will be automatically generated and published here when the next CI run completes.</p>
                  <p><a href="../prism_mcp_rs/">← Back to API documentation</a></p>
              </div>
          </body>
          </html>
          EOF
          fi
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
