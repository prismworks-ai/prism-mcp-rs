name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

# Cancel in-progress runs when a new push happens
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CRATES_IO_USER_AGENT: prism-mcp-rs-release-ci/1.0 (+https://github.com/prismworks-ai/prism-mcp-rs)

jobs:
  # Validate library builds across platforms
  validate:
    name: Validate Library Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
        shell: bash

      # Install OpenSSL for x86_64-unknown-linux-gnu only (for reqwest dependencies)
      - name: Install OpenSSL (Linux x86_64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
        shell: bash

      - name: Build library
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} --all-features
          else
            cargo build --release --target ${{ matrix.target }} --all-features
          fi
        shell: bash

      - name: Validate library build
        run: |
          echo "✅ Library build validation successful for ${{ matrix.target }}"
          echo "📦 prism-mcp-rs is a library crate - distributed via crates.io"
        shell: bash

  # Create GitHub release (library source distribution)
  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create source tarball
        run: |
          # First create a crate package (what would be published to crates.io)
          cargo package
          cp target/package/prism-mcp-rs-${{ steps.version.outputs.version }}.crate ./
          
          # Then create clean source distribution (after cargo package to avoid dirty working dir)
          git archive --format=tar.gz --prefix=prism-mcp-rs-${{ steps.version.outputs.version }}/ HEAD > prism-mcp-rs-${{ steps.version.outputs.version }}-src.tar.gz
      - name: Extract release notes
        id: extract_notes
        run: |
          # Extract release notes from CHANGELOG.md or README.md
          if [ -f CHANGELOG.md ]; then
            # Try to extract version-specific notes from CHANGELOG
            awk '/^## \[?v?${{ steps.version.outputs.version }}\]?/{flag=1; next} /^## \[?v?[0-9]/{flag=0} flag {print}' CHANGELOG.md > release_notes.txt
          fi
          
          # If no specific notes found, create default notes
          if [ ! -s release_notes.txt ]; then
            echo "## prism-mcp-rs v${{ steps.version.outputs.version }}" > release_notes.txt
            echo "" >> release_notes.txt
            echo "Production-grade Rust SDK for Model Context Protocol with enterprise features." >> release_notes.txt
            echo "" >> release_notes.txt
            echo "### Installation" >> release_notes.txt
            echo "\`\`\`toml" >> release_notes.txt
            echo "[dependencies]" >> release_notes.txt
            echo "prism-mcp-rs = \"${{ steps.version.outputs.version }}\"" >> release_notes.txt
            echo "\`\`\`" >> release_notes.txt
            echo "" >> release_notes.txt
            echo "### Features" >> release_notes.txt
            echo "- ⚡ High-performance async MCP implementation" >> release_notes.txt
            echo "- 🔒 Enterprise-grade security and authentication" >> release_notes.txt
            echo "- 🚀 Multi-transport support (HTTP/2, SSE, WebSockets)" >> release_notes.txt
            echo "- 📊 Comprehensive observability and metrics" >> release_notes.txt
            echo "- 🛠️ Production-ready error handling" >> release_notes.txt
            echo "" >> release_notes.txt
            echo "**Platform Validation**: ✅ Linux (x86_64, ARM64) ✅ macOS (Intel, Apple Silicon) ✅ Windows" >> release_notes.txt
          fi
        shell: bash

      - name: Create Release
        run: |
          echo "🚀 Creating GitHub release..."
          if gh release view v${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "ℹ️  Release v${{ steps.version.outputs.version }} already exists, skipping creation"
            echo "✅ GitHub release already available!"
          else
            gh release create v${{ steps.version.outputs.version }} \
              --title "prism-mcp-rs v${{ steps.version.outputs.version }}" \
              --notes-file release_notes.txt \
              --verify-tag \
              prism-mcp-rs-${{ steps.version.outputs.version }}-src.tar.gz \
              prism-mcp-rs-${{ steps.version.outputs.version }}.crate
            echo "✅ GitHub release created successfully!"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy documentation to GitHub Pages
  docs:
    name: Deploy Documentation
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build documentation
        run: |
          cargo doc --all-features --no-deps
          echo '<meta http-equiv="refresh" content="0; url=prism_mcp_rs">' > target/doc/index.html
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./target/doc
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version consistency
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          RELEASE_VERSION="${{ steps.version.outputs.version }}"
          
          echo "📦 Cargo.toml version: $CARGO_VERSION"
          echo "🏷️  Release version: $RELEASE_VERSION"
          
          if [[ "$CARGO_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "❌ Version mismatch: Cargo.toml ($CARGO_VERSION) != Release tag ($RELEASE_VERSION)"
            echo "💡 Please update Cargo.toml version to match the release tag"
            exit 1
          fi
          
          echo "✅ Version consistency verified"

      - name: Verify package integrity
        run: |
          echo "🔍 Running package verification..."
          cargo package
          echo "✅ Package verification completed"

      - name: Check if version already published
        id: check_published
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "🔍 Checking whether prism-mcp-rs $version is already published..."

          if curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --user-agent "$CRATES_IO_USER_AGENT" \
            "https://crates.io/api/v1/crates/prism-mcp-rs/$version" \
            | jq -e --arg version "$version" '.version.num == $version' >/dev/null; then
            echo "ℹ️  Version $version is already published to crates.io"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "📦 Version $version is not yet published"
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to crates.io
        if: steps.check_published.outputs.already_published == 'false'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "🚀 Publishing prism-mcp-rs v$version to crates.io..."

          set +e
          publish_output=$(cargo publish 2>&1)
          publish_status=$?
          set -e
          echo "$publish_output"

          if [ "$publish_status" -ne 0 ]; then
            echo "Publication returned status $publish_status; checking for an index race..."
            for attempt in {1..12}; do
              if curl --fail --silent --show-error \
                --user-agent "$CRATES_IO_USER_AGENT" \
                "https://crates.io/api/v1/crates/prism-mcp-rs/$version" \
                | jq -e --arg version "$version" '.version.num == $version' >/dev/null; then
                echo "✅ Version $version is published; treating the duplicate-publication race as success."
                exit 0
              fi
              if [ "$attempt" -lt 12 ]; then
                sleep 5
              fi
            done

            echo "❌ Publication failed and version $version is not available on crates.io."
            exit "$publish_status"
          fi

          echo "✅ Successfully published to crates.io!"
          echo "📦 Package: https://crates.io/crates/prism-mcp-rs"
          echo "📚 Docs: https://docs.rs/prism-mcp-rs/$version"
        
      - name: Skip publication
        if: steps.check_published.outputs.already_published == 'true'
        run: |
          echo "⏭️  Skipping publication - version already published"
          echo "📦 Package: https://crates.io/crates/prism-mcp-rs"
          echo "📚 Docs: https://docs.rs/prism-mcp-rs/${{ steps.version.outputs.version }}"

      - name: Post-publication verification
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "🔍 Verifying prism-mcp-rs $version on crates.io..."

          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --user-agent "$CRATES_IO_USER_AGENT" \
              "https://crates.io/api/v1/crates/prism-mcp-rs/$version" \
              | jq -e --arg version "$version" '.version.num == $version' >/dev/null; then
              echo "✅ Version $version confirmed available on crates.io!"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "⏳ Attempt $attempt did not find the version; retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "❌ Version $version is still unavailable after verification retries."
          exit 1

  # Release summary
  summary:
    name: Release Summary
    needs: [validate, release, docs, publish]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Release Summary
        run: |
          echo "# 🚀 Release Summary: prism-mcp-rs v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Platform validation
          if [[ "${{ needs.validate.result }}" == "success" ]]; then
            echo "✅ **Platform Validation**: All platforms validated successfully" >> $GITHUB_STEP_SUMMARY
            echo "   - Linux (x86_64, ARM64)" >> $GITHUB_STEP_SUMMARY  
            echo "   - macOS (Intel, Apple Silicon)" >> $GITHUB_STEP_SUMMARY
            echo "   - Windows (x86_64)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Platform Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # GitHub release
          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "✅ **GitHub Release**: Created successfully" >> $GITHUB_STEP_SUMMARY
            echo "   - 📦 [Release Page](https://github.com/prismworks-ai/prism-mcp-rs/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
            echo "   - 📄 Source tarball attached" >> $GITHUB_STEP_SUMMARY
            echo "   - 📦 Crate package attached" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **GitHub Release**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Documentation
          if [[ "${{ needs.docs.result }}" == "success" ]]; then
            echo "✅ **Documentation**: Deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
            echo "   - 📚 [API Documentation](https://prismworks-ai.github.io/prism-mcp-rs/)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Documentation**: Deployment failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Crates.io publication
          if [[ "${{ needs.publish.result }}" == "success" ]]; then
            echo "✅ **Crates.io Publication**: Published successfully" >> $GITHUB_STEP_SUMMARY
            echo "   - 📦 [Package Page](https://crates.io/crates/prism-mcp-rs)" >> $GITHUB_STEP_SUMMARY
            echo "   - 📚 [docs.rs](https://docs.rs/prism-mcp-rs/${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
            echo "   - \`cargo add prism-mcp-rs@${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Crates.io Publication**: Failed or skipped" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [[ "${{ needs.validate.result }}" == "success" && "${{ needs.release.result }}" == "success" && "${{ needs.docs.result }}" == "success" && "${{ needs.publish.result }}" == "success" ]]; then
            echo "🎉 **Overall Status**: Release completed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Overall Status**: Release completed with some issues" >> $GITHUB_STEP_SUMMARY
          fi
