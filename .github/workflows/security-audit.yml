name: Security Audit

# Run security audits weekly and on security-related changes
on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "supply-chain/**"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "supply-chain/**"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Install security audit tools
        run: |
          cargo install --force cargo-audit
          cargo install --force cargo-deny
          cargo install --force cargo-vet

      - name: Update advisory database
        run: cargo audit

      - name: Run cargo-audit
        id: audit
        run: |
          echo "## Security Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          if cargo audit --no-fetch --json > audit-report.json; then
            echo "✅ No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "audit_status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Vulnerabilities detected:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat audit-report.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "audit_status=failure" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run cargo-deny
        id: deny
        run: |
          echo "## Policy Compliance Check" >> $GITHUB_STEP_SUMMARY
          if cargo deny check all; then
            echo "✅ All policies compliant" >> $GITHUB_STEP_SUMMARY
            echo "deny_status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Policy violations detected" >> $GITHUB_STEP_SUMMARY
            echo "deny_status=failure" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run cargo-vet
        id: vet
        run: |
          echo "## Supply Chain Verification" >> $GITHUB_STEP_SUMMARY
          if cargo vet check; then
            echo "✅ Supply chain verified" >> $GITHUB_STEP_SUMMARY
            echo "vet_status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Unvetted dependencies found" >> $GITHUB_STEP_SUMMARY
            echo "vet_status=failure" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Analyze dependencies
        run: |
          echo "## Dependency Analysis" >> $GITHUB_STEP_SUMMARY

          # Check for duplicates
          echo "### Duplicate Dependencies" >> $GITHUB_STEP_SUMMARY
          if duplicates=$(cargo tree --duplicates); then
            if [ -n "$duplicates" ]; then
              echo "⚠️ Duplicate dependencies found:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$duplicates" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No duplicate dependencies" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Check for unsafe code
          echo "### Unsafe Code Analysis" >> $GITHUB_STEP_SUMMARY
          if unsafe_count=$(grep -r "unsafe" src/ --include="*.rs" | wc -l); then
            echo "📊 Unsafe blocks found: $unsafe_count" >> $GITHUB_STEP_SUMMARY
            if [ "$unsafe_count" -gt 10 ]; then
              echo "⚠️ High number of unsafe blocks detected" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-${{ github.run_number }}
          path: |
            audit-report.json
            *.txt
          retention-days: 30

      - name: Check overall status
        run: |
          audit_status="${{ steps.audit.outputs.audit_status }}"
          deny_status="${{ steps.deny.outputs.deny_status }}"
          vet_status="${{ steps.vet.outputs.vet_status }}"

          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: $audit_status" >> $GITHUB_STEP_SUMMARY
          echo "- Policy Check: $deny_status" >> $GITHUB_STEP_SUMMARY
          echo "- Supply Chain: $vet_status" >> $GITHUB_STEP_SUMMARY

          # Fail the job if critical security issues found
          if [ "$audit_status" = "failure" ]; then
            echo "❌ Critical security vulnerabilities detected!"
            exit 1
          fi

          if [ "$deny_status" = "failure" ]; then
            echo "❌ Security policy violations detected!"
            exit 1
          fi

          # Warn about supply chain issues but don't fail
          if [ "$vet_status" = "failure" ]; then
            echo "⚠️ Supply chain verification failed - please review"
          fi

          echo "✅ Security audit completed successfully"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Unicode-DFS-2016, Unicode-3.0, MPL-2.0
