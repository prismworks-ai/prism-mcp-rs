name: Security

on:
  push:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "deny.toml"
      - "supply-chain/**"
      - ".github/dependabot.yml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "deny.toml"
      - "supply-chain/**"
      - ".github/dependabot.yml"
      - ".github/workflows/security.yml"
  schedule:
    # Resolve and audit the current compatible graph every day.
    - cron: "0 2 * * *"
    # Run the deeper cargo-vet check every Monday.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      run_supply_chain:
        description: "Run the non-blocking cargo-vet supply-chain check"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  CARGO_HTTP_TIMEOUT: 60

jobs:
  audit:
    name: Dependency Vulnerability Audit
    if: github.event_name != 'schedule' || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Resolve dependency snapshot
        run: cargo generate-lockfile

      - name: Audit vulnerabilities and warnings
        run: cargo audit --deny warnings --json | tee audit-report.json

      - name: Publish audit summary
        if: always()
        run: |
          echo "## Dependency vulnerability audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The resolved Cargo.lock and cargo-audit JSON report are attached to this run." >> "$GITHUB_STEP_SUMMARY"
          echo "This snapshot is diagnostic evidence for this run; library consumers resolve their own compatible graph." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload resolved dependency snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            Cargo.lock
            audit-report.json
          if-no-files-found: warn
          retention-days: 30

  policy:
    name: Dependency Policy
    if: github.event_name != 'schedule' || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Resolve dependency snapshot
        run: cargo generate-lockfile

      - name: Check dependency policies
        run: cargo deny check bans licenses sources

  supply-chain:
    name: Supply Chain Review
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_supply_chain)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet

      - name: Resolve dependency snapshot
        run: cargo generate-lockfile

      - name: Check supply-chain attestations
        id: vet
        run: cargo vet check 2>&1 | tee cargo-vet-report.txt
        continue-on-error: true

      - name: Publish supply-chain summary
        if: always()
        run: |
          echo "## Supply-chain review" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.vet.outcome }}" = "success" ]; then
            echo "cargo-vet accepted the resolved dependency graph." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::cargo-vet found missing attestations or could not complete; review the attached report"
            echo "cargo-vet is advisory until the repository has a complete attestation baseline. Review the attached report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-review-${{ github.run_id }}
          path: |
            Cargo.lock
            cargo-vet-report.txt
          if-no-files-found: warn
          retention-days: 30

  dependency-review:
    name: Pull Request Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
