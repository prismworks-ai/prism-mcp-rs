[package]
name = "prism-mcp-rs"
version = "0.1.0"
edition = "2021"
authors = ["Prismworks AI <developers@prismworks.ai>"]
license = "MIT"
description = "Production-grade Rust SDK for Model Context Protocol with enterprise features"
repository = "https://github.com/prismworks-ai/prism-mcp-rs"
homepage = "https://github.com/prismworks-ai/prism-mcp-rs"
documentation = "https://docs.rs/prism-mcp-rs"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "ai", "llm", "enterprise"]
categories = ["api-bindings", "asynchronous", "network-programming", "development-tools"]
exclude = [
    ".github/",
    "scripts/",
    "tests/",
    "examples/",
    "docs/",
    "reports/",
    "Makefile",
    ".gitignore",
    "CONTRIBUTING.md",
    "DEVELOPMENT.md",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9", optional = true }
tokio = { version = "1.34", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
pin-project = "1.1"
once_cell = "1.19"
indexmap = "2.0"
dashmap = "6.1.0"
parking_lot = "0.12"

# HTTP transport (optional)
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
hyper = { version = "1.6", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
axum = { version = "0.7", optional = true }

# WebSocket transport (optional)
tokio-tungstenite = { version = "0.20", optional = true }
tungstenite = { version = "0.20", optional = true }

# Plugin support (optional)
libloading = { version = "0.8", optional = true }
# Note: abi_stable commented out due to unmaintained dependencies
# Consider alternative plugin architectures or wait for updates
# abi_stable = { version = "0.11", optional = true }

# Authentication (optional)
jsonwebtoken = { version = "9.1", optional = true }
argon2 = { version = "0.5", optional = true }

# TLS support (optional)
rustls = { version = "0.21", optional = true }
tokio-rustls = { version = "0.24", optional = true }

# Error reporting enhancements
color-eyre = { version = "0.6", optional = true }

# URL parsing
url = "2.5"

# Missing dependencies
rand = "0.8"
brotli = { version = "7.0", optional = true }
zstd = { version = "0.13", optional = true }
notify = { version = "6.1", optional = true }
base64 = "0.22"
sha2 = "0.10"
futures-util = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
h2 = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
uuid = { version = "1.10", features = ["v4", "serde"] }
http = "1.3"

# Utility dependencies (always included for simplicity)
dirs = { version = "5.0" }
fastrand = { version = "2.3" }

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"
test-log = "0.2"
env_logger = "0.10"
tokio-test = "0.4"
mockito = "1.2"
wiremock = "0.6"
serial_test = "3.0"
tempfile = "3.8"
regex = "1.10"
rstest = "0.18"
fake = "2.8"
quickcheck = "1.0"
quickcheck_macros = "1.0"
insta = { version = "1.34", features = ["json"] }

[features]
default = ["stdio"]

# Core transports
stdio = []
http = ["dep:reqwest", "dep:hyper", "dep:tower", "dep:tower-http", "dep:axum"]
websocket = ["dep:tokio-tungstenite", "dep:tungstenite"]

# HTTP protocol features
sse = ["http", "dep:tokio-stream", "dep:futures-util"]  # Server-Sent Events for real-time updates
http2 = ["http", "dep:h2"]  # HTTP/2 protocol support

# HTTP enhancements
chunked-encoding = ["http"]  # Chunked transfer encoding for large payloads
compression = ["http", "dep:brotli", "dep:flate2", "dep:zstd"]  # Response compression

# Security & Extensions
# Note: plugin feature temporarily disabled due to abi_stable unmaintained dependencies
# plugin = ["dep:libloading", "dep:abi_stable", "dep:notify", "dep:serde_yaml"]
plugin = ["dep:libloading", "dep:notify", "dep:serde_yaml"]
auth = ["dep:jsonwebtoken", "dep:argon2"]
tls = ["dep:rustls", "dep:tokio-rustls"]

# Feature bundles
full = ["stdio", "http", "websocket", "sse", "http2", "chunked-encoding", "compression", "plugin", "auth", "tls"]
minimal = []

# Development features
dev = ["dep:color-eyre"]

# Examples
[[example]]
name = "advanced_2025_features"
path = "examples/advanced_2025_features.rs"
required-features = ["stdio"]

[[example]]
name = "advanced_features_showcase"
path = "examples/advanced_features_showcase.rs"
required-features = ["stdio"]

[[example]]
name = "bidirectional"
path = "examples/bidirectional.rs"
required-features = ["stdio"]

[[example]]
name = "bidirectional_communication_demo"
path = "examples/bidirectional_communication_demo.rs"
required-features = ["stdio"]


[[example]]
name = "convenience_methods_demo"
path = "examples/convenience_methods_demo.rs"
required-features = ["stdio"]

[[example]]
name = "custom_transport"
path = "examples/custom_transport.rs"
required-features = ["stdio"]

[[example]]
name = "sse_showcase"
path = "examples/sse_showcase.rs"
required-features = ["sse"]

[[example]]
name = "http2_showcase"
path = "examples/http2_showcase.rs"
required-features = ["http2"]

[[example]]
name = "chunked_encoding_showcase"
path = "examples/chunked_encoding_showcase.rs"
required-features = ["chunked-encoding"]

[[example]]
name = "transport_selection_guide"
path = "examples/transport_selection_guide.rs"
required-features = ["stdio"]

[[bench]]
name = "server_benchmarks"
harness = false

[[bench]]
name = "client_benchmarks"
harness = false

[[bench]]
name = "plugin_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["."]