[package]
name = "prism-mcp-rs"
version = "0.1.0"
edition = "2021"
authors = ["Prismworks AI <developers@prismworks.ai>"]
license = "MIT"
description = "Rust implementation of the Model Context Protocol (MCP) SDK"
repository = "https://github.com/prismworks-ai/prism-mcp-rs"
homepage = "https://github.com/prismworks-ai/prism-mcp-rs"
documentation = "https://docs.rs/prism-mcp-rs"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "ai", "llm", "sdk"]
categories = ["api-bindings", "asynchronous", "network-programming"]
exclude = [
    ".github/",
    "scripts/",
    "tests/",
    "examples/",
    "docs/",
    "reports/",
    "Makefile",
    ".gitignore",
    "CONTRIBUTING.md",
    "DEVELOPMENT.md",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
pin-project = "1.1"
once_cell = "1.19"
indexmap = "2.0"
dashmap = "6.1.0"
parking_lot = "0.12"

# HTTP transport (optional)
reqwest = { version = "0.11", features = ["json", "stream"], optional = true }
hyper = { version = "0.14", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.4", features = ["cors", "trace"], optional = true }
axum = { version = "0.7", optional = true }

# WebSocket transport (optional)
tokio-tungstenite = { version = "0.20", optional = true }
tungstenite = { version = "0.20", optional = true }

# Plugin support (optional)
libloading = { version = "0.8", optional = true }
abi_stable = { version = "0.11", optional = true }

# Authentication (optional)
jsonwebtoken = { version = "9.1", optional = true }
argon2 = { version = "0.5", optional = true }

# TLS support (optional)
rustls = { version = "0.21", optional = true }
tokio-rustls = { version = "0.24", optional = true }

# Error reporting enhancements
color-eyre = { version = "0.6", optional = true }

# URL parsing
url = "2.5"

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"
test-log = "0.2"
env_logger = "0.10"
tokio-test = "0.4"
mockito = "1.2"
wiremock = "0.5"
serial_test = "3.0"
tempfile = "3.8"
regex = "1.10"
rstest = "0.18"
fake = "2.8"
quickcheck = "1.0"
quickcheck_macros = "1.0"
insta = { version = "1.34", features = ["json"] }

[features]
default = ["stdio"]
stdio = []
http = ["dep:reqwest", "dep:hyper", "dep:tower", "dep:tower-http", "dep:axum"]
websocket = ["dep:tokio-tungstenite", "dep:tungstenite"]
plugin = ["dep:libloading", "dep:abi_stable"]
auth = ["dep:jsonwebtoken", "dep:argon2"]
tls = ["dep:rustls", "dep:tokio-rustls"]
streaming-http = ["http"]
full = ["stdio", "http", "websocket", "plugin", "auth", "tls", "streaming-http"]
minimal = []

# Development features
dev = ["dep:color-eyre"]

# Examples
[[example]]
name = "advanced_2025_features"
path = "examples/advanced_2025_features.rs"
required-features = ["stdio"]

[[example]]
name = "advanced_features_showcase"
path = "examples/advanced_features_showcase.rs"
required-features = ["stdio"]

[[example]]
name = "bidirectional"
path = "examples/bidirectional.rs"
required-features = ["stdio"]

[[example]]
name = "bidirectional_communication_demo"
path = "examples/bidirectional_communication_demo.rs"
required-features = ["stdio"]

[[example]]
name = "complete_workflow"
path = "examples/complete_workflow.rs"
required-features = ["stdio"]

[[example]]
name = "convenience_methods_demo"
path = "examples/convenience_methods_demo.rs"
required-features = ["stdio"]

[[example]]
name = "custom_transport"
path = "examples/custom_transport.rs"
required-features = ["stdio"]

[[example]]
name = "error_recovery"
path = "examples/error_recovery.rs"
required-features = ["stdio"]

[[example]]
name = "performance_benchmarks"
path = "examples/performance_benchmarks.rs"
required-features = ["stdio"]

[[example]]
name = "plugin_integration"
path = "examples/plugin_integration.rs"
required-features = ["stdio"]

[[example]]
name = "production_error_handling_demo"
path = "examples/production_error_handling_demo.rs"
required-features = ["stdio"]

[[example]]
name = "server_builder_demo"
path = "examples/server_builder_demo.rs"
required-features = ["stdio"]

[[example]]
name = "streaming_http2_showcase"
path = "examples/streaming_http2_showcase.rs"
required-features = ["streaming-http"]

[[example]]
name = "streaming_http_showcase"
path = "examples/streaming_http_showcase.rs"
required-features = ["streaming-http"]

[[example]]
name = "transport_selection_guide"
path = "examples/transport_selection_guide.rs"
required-features = ["stdio"]

[[bench]]
name = "server_benchmarks"
harness = false

[[bench]]
name = "client_benchmarks"
harness = false

[[bench]]
name = "plugin_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["."]