[package]
name = "prism-mcp-rs"
version = "2.0.2"
edition = "2021"
rust-version = "1.85"
authors = ["Prismworks AI <developers@prismworks.ai>"]
license = "MIT"
description = "Async Rust SDK for building Model Context Protocol clients and servers"
repository = "https://github.com/prismworks-ai/prism-mcp-rs"
homepage = "https://github.com/prismworks-ai/prism-mcp-rs"
documentation = "https://docs.rs/prism-mcp-rs"
readme = "README.md"
keywords = ["ai", "llm", "agents", "assistant", "protocol"]
categories = ["api-bindings", "asynchronous", "development-tools", "web-programming"]
exclude = [
    ".github/",
    "scripts/",
    "docs/",
    "reports/",
    ".edit_backups/",
    "**/*.bak",
    "**/~*",
    "Makefile",
    ".gitignore",
    "CONTRIBUTING.md",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9", optional = true }
tokio = { version = "1.34", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = ">=0.3.20, <0.4", features = ["env-filter"] }
opentelemetry = { version = "0.31", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.31", features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["trace", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4.20", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.11.1"
pin-project = "1.1"
once_cell = "1.19"
indexmap = "2.0"
dashmap = "6.1.0"
parking_lot = "0.12"

# HTTP transport (optional)
reqwest = { version = "0.13", features = ["json", "stream", "form", "rustls"], default-features = false, optional = true }
hyper = { version = "1.6", features = ["full"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
axum = { version = "0.8", optional = true }

# WebSocket transport (optional)
tokio-tungstenite = { version = "0.28", optional = true }
tungstenite = { version = "0.28", optional = true }

# Plugin support (optional)
libloading = { version = "0.9", optional = true }
# Note: abi_stable commented out due to unmaintained dependencies
# Consider alternative plugin architectures or wait for updates
# abi_stable = { version = "0.11", optional = true }

# Authentication (optional)
jsonwebtoken = { version = "10.3", optional = true }
time = { version = "0.3.47", optional = true }
argon2 = { version = "0.5", optional = true }

# TLS support (optional)
rustls = { version = "0.23.31", optional = true }
tokio-rustls = { version = "0.26", optional = true }

# Error reporting enhancements
color-eyre = { version = "0.6", optional = true }

# URL parsing
url = "2.5"

# Missing dependencies
rand = "0.10"
regex = "1.10"
brotli = { version = "8.0", optional = true }
zstd = { version = "0.13", optional = true }
notify = { version = "8.2", optional = true }
base64 = "0.22"
sha2 = "0.10"
futures-util = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
h2 = { version = "0.4.4", optional = true }
flate2 = { version = "1.0", optional = true }
uuid = { version = "1.10", features = ["v4", "serde"] }
http = "1.3"

# Utility dependencies (always included for simplicity)
dirs = { version = "6.0" }
fastrand = { version = "2.3" }
criterion = { version = "0.8", features = ["async_tokio"], optional = true }

[dev-dependencies]
proptest = "1.3"
test-log = "0.2"
env_logger = "0.11"
tokio-test = "0.4"
mockito = "1.2"
wiremock = "0.6"
serial_test = "3.0"
tempfile = "3.8"
regex = "1.10"
rstest = "0.26"
fake = "4.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
insta = { version = "1.34", features = ["json"] }

[features]
default = ["stdio"]

# Core transports
stdio = []
http = ["dep:reqwest", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:tower-http", "dep:axum"]
websocket = ["dep:tokio-tungstenite", "dep:tungstenite"]

# HTTP protocol features
sse = ["http", "dep:tokio-stream", "dep:futures-util"]  # Server-Sent Events for real-time updates
http2 = ["http", "dep:h2"]  # HTTP/2 protocol support

# HTTP enhancements
chunked-encoding = ["http"]  # Chunked transfer encoding for large payloads
compression = ["http", "dep:brotli", "dep:flate2", "dep:zstd"]  # Response compression

# Security & Extensions
# Trusted native plugin loading. This is not a sandbox or stable cross-toolchain ABI.
plugin = ["dep:libloading", "dep:notify", "dep:serde_yaml"]
auth = ["dep:jsonwebtoken", "dep:argon2", "dep:time"]
tls = ["dep:rustls", "dep:tokio-rustls"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

# Feature bundles
full = ["stdio", "http", "websocket", "sse", "http2", "chunked-encoding", "compression", "plugin", "auth", "tls", "otel"]
minimal = []

# Development features
dev = ["dep:color-eyre"]
bench = ["dep:criterion"]  # Benchmarking feature
tracing-subscriber = []  # Tracing subscriber feature

# Examples
[[example]]
name = "bidirectional_basic"
path = "examples/bidirectional_basic.rs"
required-features = ["stdio"]

[[example]]
name = "closure_handlers"
path = "examples/closure_handlers.rs"
required-features = ["stdio"]

[[example]]
name = "custom_transport"
path = "examples/custom_transport.rs"
required-features = ["stdio"]

# Feature examples
[[example]]
name = "01_mcp_tool_macro"
path = "examples/features/01_mcp_tool_macro.rs"
required-features = ["stdio"]

[[example]]
name = "02_resources_api"
path = "examples/features/02_resources_api.rs"
required-features = ["stdio"]

[[example]]
name = "03_prompts_api"
path = "examples/features/03_prompts_api.rs"
required-features = ["stdio"]

[[example]]
name = "04_sampling_api"
path = "examples/features/04_sampling_api.rs"
required-features = ["stdio"]

[[example]]
name = "05_http_transport"
path = "examples/features/05_http_transport.rs"
required-features = ["http"]

[[example]]
name = "06_websocket_transport"
path = "examples/features/06_websocket_transport.rs"
required-features = ["websocket"]

[[example]]
name = "07_authentication"
path = "examples/features/07_authentication.rs"
required-features = ["http", "auth"]

[[example]]
name = "08_error_handling"
path = "examples/features/08_error_handling.rs"
required-features = ["stdio"]

[[example]]
name = "09_configuration"
path = "examples/features/09_configuration.rs"
required-features = ["stdio"]

[[example]]
name = "10_plugin_system"
path = "examples/features/10_plugin_system.rs"
required-features = ["stdio", "plugin"]

[[example]]
name = "11_advanced_tools"
path = "examples/features/11_advanced_tools.rs"
required-features = ["stdio"]

[[example]]
name = "12_integration_patterns"
path = "examples/features/12_integration_patterns.rs"

[[example]]
name = "fixed_example"
path = "examples/basic/fixed_example.rs"
required-features = ["http"]

# Benchmark utilities (run with: cargo run --bin <benchmark_name> --features bench)
# Also supports standard cargo bench for CI/CD compatibility
[[bin]]
name = "plugin_benchmarks"
path = "utilities/benchmarks/plugin_benchmarks.rs"
required-features = ["bench"]

[[bin]]
name = "client_benchmarks"
path = "utilities/benchmarks/client_benchmarks.rs"
required-features = ["bench"]

[[bin]]
name = "server_benchmarks"
path = "utilities/benchmarks/server_benchmarks.rs"
required-features = ["bench"]

# Standard bench entries for CI/CD compatibility (call the utilities)
[[bench]]
name = "all_benchmarks"
harness = false
required-features = ["bench"]

# Optimize build profiles
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.test]
# Optimized for CI speed
opt-level = 1
debug = 1
incremental = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace]
members = ["."]
